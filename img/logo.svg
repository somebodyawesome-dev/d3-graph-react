<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset=".55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx=".38" cy=".32" r=".85">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#a78bfa" stop-opacity=".10"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="#0d1019"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#glow)"/>
  <rect x="14" y="14" width="484" height="484" rx="110" fill="none"
        stroke="#94a3b8" stroke-opacity=".22" stroke-width="4"/>

  <!-- links -->
  <g stroke="#818cf8" stroke-opacity=".6" stroke-width="13" stroke-linecap="round">
    <line x1="262" y1="272" x2="152" y2="134"/>
    <line x1="262" y1="272" x2="372" y2="122"/>
    <line x1="262" y1="272" x2="420" y2="318"/>
    <line x1="262" y1="272" x2="300" y2="424"/>
    <line x1="262" y1="272" x2="118" y2="350"/>
    <line x1="152" y1="134" x2="372" y2="122" stroke-opacity=".32"/>
    <line x1="420" y1="318" x2="300" y2="424" stroke-opacity=".32"/>
    <line x1="152" y1="134" x2="90"  y2="224" stroke-opacity=".4" stroke-width="9"/>
    <line x1="372" y1="122" x2="447" y2="206" stroke-opacity=".4" stroke-width="9"/>
  </g>

  <!-- nodes: ring in tile color separates them from the links -->
  <g stroke="#0d1019" stroke-width="10">
    <circle cx="262" cy="272" r="50" fill="url(#hub)"/>
    <circle cx="152" cy="134" r="28" fill="#818cf8"/>
    <circle cx="372" cy="122" r="33" fill="#22d3ee"/>
    <circle cx="420" cy="318" r="27" fill="#a78bfa"/>
    <circle cx="300" cy="424" r="31" fill="#22d3ee"/>
    <circle cx="118" cy="350" r="30" fill="#a78bfa"/>
    <circle cx="90"  cy="224" r="14" fill="#94a3b8"/>
    <circle cx="447" cy="206" r="14" fill="#94a3b8"/>
  </g>

  <!-- hub highlight -->
  <circle cx="245" cy="254" r="14" fill="#ffffff" opacity=".35"/>
</svg>
